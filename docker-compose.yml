services:
  text_llm:
    build: .
    container_name: text_llm_test 
    runtime: nvidia 
    shm_size: '16g'
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/hf_cache
    ports:
      - "8100:8100" 
    volumes:
      - ./hf_cache:/hf_cache
    networks:
      - ml-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m" 
        max-file: "3"
    command: >
      --model Qwen/Qwen3.5-9B
      --trust-remote-code
      --language-model-only
      --max-model-len 8192
      --gpu-memory-utilization 0.3
      --reasoning-parser qwen3
      --enable-prefix-caching
      --kv-cache-dtype fp8
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --port 8100

networks:
  ml-net:
    external: true